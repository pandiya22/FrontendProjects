<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<style>
    body{
        margin:4px;
    }
    h2{
        text-align: center;
    }
    p{
     text-align: center;  
     font-weight: 100; 
     font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
     color: green;
    }
    
    img{
        width:400px;
        height:250px;
        padding-left: 10px;
        
    }
    button{  
     font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
     color: white;
     width:120px;
     height:30px;
     border:none;
     border-radius: 5px;
     background-color: rgb(34, 228, 34);
     margin-left: 150px;
     
    }
    button:hover{
        cursor: pointer;
        background-color: black;

    }
    .container-1{
        display:inline-flex;
        margin-bottom: 30px;
    }
    .container-2{
        display:inline-flex;
        margin-bottom: 30px;
    }
    .pro-2,.pro-3{
        margin-left:80px
    }
    .pro-5,.pro-6{
        margin-left: 80px;
    }
</style>
<body>
    <div class="container-1">
    <div class="pro-1">       
     <img src="../images/bat.jpg"> 
     <h2>Bat & Ball</h2>
     <p>₹799</p>
     <button>Add to cart</button>
     </div>

     <div class="pro-2">
     <img src="../images/soap.jpg"> 
     <h2>Soap</h2>
     <p>₹599</p>
     <button>Add to cart</button>
     </div>

     <div class="pro-3">
     <img src="../images/shoe.jpg"> 
     <h2>Shoe</h2>
     <p>₹1799</p>
     <button>Add to cart</button>
     </div>
    </div>
    
    <div class="container-2">
     <div class="pro-4">
     <img src="../images/camera.jpg"> 
     <h2>Camera</h2>
     <p>₹2099</p>
     <button>Add to cart</button>
     </div>


     <div class="pro-5">       
     <img src="../images/watch.jpg"> 
     <h2>Watch</h2>
     <p>₹799</p>
     <button>Add to cart</button>
     </div>

     <div class="pro-6">
     <img src="../images/makeup.jpg"> 
     <h2>Makeup Product</h2>
     <p>₹599</p>
     <button>Add to cart</button>
     </div>
    </div>
     
    
</body>
</html>
