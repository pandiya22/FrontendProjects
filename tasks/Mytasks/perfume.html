<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Product</title>
</head>
<style>
    .con-1{
         background-color:black;
         color:gray;
         display:flex;
         flex-direction: row;
         justify-content: space-around;
         font-family:poppins;
         margin: 20px;
         position:relative;
         top:20px;
         width:1400px;
    }
    .con-2{
        background-color:pink;
        color:black;
        height:250px;
        margin:20px;
        text-align: center;
        padding-top: 80px;
        font-family: poppins;
        font-size: 25px;
        width:1400px;
    }
    p{
        font-weight: bold;
        font-size: 19px;
    }
    .img-con-1{
        border:none;
        border-radius: 5%;
        width:300px;
        height:400px;
        box-shadow: grey 0.5px 0.5px 2px 2px;
    }
    img{
        width:250px;
        height:200px;
        padding:20px;
    }
    .container{
        display: flex;
        flex-direction: row;
        margin-left: 250px;
        
        
    }
   .container h2,p{
        text-align: center;
    }
    .container p{
        color:green
    }
    button{
       font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
     color: white;
     width:120px;
     height:30px;
     border:none;
     border-radius: 5px;
     background-color: black;
     margin-left: 90px;
     
    }
    button:hover{
        cursor: pointer;
        background-color: green;
    }
    .footer{
        background-color: purple;
        margin-left:500px;
        width:400px;
        height: 600px;
        border-radius: 5%;
        padding-top: 50px;

    }
    .footer h2,h3,h4{
        text-align: center;
    }
    .footer button{
        margin-left:140px;
        font-weight: lighter;
        font-family: Arial, Helvetica, sans-serif;
    }
    
    
</style>
<body>
    <div class="con-1">
        <h4>Home</h4>
        <h4>Products</h4>
        <h4>Profile</h4>
        <h4>Contacts</h4>
    </div>
    <div class="con-2">
        <h2>Welcome to Mini Shop</h2>
        <p>Find the best products at affordable prices</p>
    </div>
     <div class="container">
    <div class="img-con-1">
    <img src="../images/bat.jpg"> 
     <h2>Bat & Ball</h2>
     <p>₹799</p>
     <button>Add to cart</button>
    </div>

    <div class="img-con-1">
    <img src="../images/shoe.jpg"> 
     <h2>Shoe</h2>
     <p>₹2799</p>
     <button>Add to cart</button>
    </div>

    <div class="img-con-1">
    <img src="../images/watch.jpg"> 
     <h2>Bat & Ball</h2>

    </div>
     </div>

     <div class="footer">
        <h2>John Doe</h2>
